<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 1 - Large Modal Form</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-alt: #1c2430;
      --panel-hover: #212836;
      --border: #30363d;
      --border-focus: #58a6ff;
      --border-accent: rgba(56, 166, 255, 0.25);
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --primary: #238636;
      --primary-hover: #2ea043;
      --accent: #58a6ff;
      --accent-cyan: #39c5cf;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', 'Noto Sans Thai', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 20% 20%, rgba(56, 139, 253, 0.12), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(57, 197, 207, 0.08), transparent 45%),
                  var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .main-card {
      text-align: center;
      max-width: 650px;
      width: 100%;
      padding: 48px 36px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
    }

    .main-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 30%, #58a6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-desc {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Toggle Modal Button */
    .btn-toggle-modal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #1f6feb 0%, #238636 100%);
      color: #ffffff;
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(31, 111, 235, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-toggle-modal:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(31, 111, 235, 0.6);
      background: linear-gradient(135deg, #388bfd 0%, #2ea043 100%);
    }

    .btn-toggle-modal:active {
      transform: translateY(0);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(4, 7, 13, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 99999;
      padding: 20px;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* Large Modal Form */
    .modal-form-dialog {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 960px; /* Modal form ขนาด Large */
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.06);
      transform: scale(0.94) translateY(12px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .modal-overlay.show .modal-form-dialog {
      transform: scale(1) translateY(0);
    }

    /* Modal Header */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-alt);
    }

    .modal-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-badge {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--accent-cyan);
      background: rgba(57, 197, 207, 0.12);
      border: 1px solid rgba(57, 197, 207, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .btn-close-modal {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-close-modal:hover {
      background: var(--panel-hover);
      color: var(--text);
    }

    /* Tabs Navigation */
    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #11161d;
      padding: 0 24px;
      gap: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      padding: 14px 20px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }

    /* Modal Body */
    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
      min-height: 380px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tab 1: Textarea without data, padding 15px */
    .tab1-textarea {
      width: 100%;
      height: 320px;
      padding: 15px; /* กำหนดขนาด padding 15px ตามโจทย์ */
      background: #0d1117;
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .tab1-textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--border-accent);
    }

    .tab1-textarea::placeholder {
      color: var(--text-dim);
    }

    /* Tab 2: Empty Div */
    .tab2-empty-div {
      min-height: 320px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 15px;
      background: rgba(13, 17, 23, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 14px;
      font-family: var(--mono);
    }

    /* Modal Footer */
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel-alt);
    }

    .btn {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      padding: 9px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--panel-hover);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background: var(--primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <!-- Card หลัก พร้อมปุ่ม Toggle Modal -->
  <div class="main-card">
    <h1 class="main-title">Lab 1: Modal Form Component</h1>
    <p class="main-desc">ทดสอบการเปิด Modal Form ขนาด Large พร้อมระบบแท็บ 2 แท็บ</p>
    
    <!-- ปุ่ม Toggle Modal -->
    <button type="button" id="toggleModalBtn" class="btn-toggle-modal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
      Toggle Modal Form (Large)
    </button>
  </div>

  <!-- Modal Overlay / Modal Form Wrapper -->
  <div id="modalOverlay" class="modal-overlay" aria-hidden="true">
    <div class="modal-form-dialog">
      <form id="modalForm" method="dialog">
        <!-- Header -->
        <div class="modal-header">
          <div class="modal-header-left">
            <h2 class="modal-title">Modal Form</h2>
            <span class="modal-badge">Large</span>
          </div>
          <button type="button" id="closeBtn" class="btn-close-modal" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Tab Bar -->
        <div class="modal-tabs">
          <button type="button" class="tab-btn active" data-tab="tab1">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            Tab 1 (Textarea)
          </button>
          <button type="button" class="tab-btn" data-tab="tab2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
            </svg>
            Tab 2 (Empty Div)
          </button>
        </div>

        <!-- Modal Body Content -->
        <div class="modal-body">
          <!-- อันแรก: textarea โหลดโค้ดจาก testLabBarrier.js พร้อมปุ่ม Test Eval Code -->
          <div id="tab1" class="tab-content active">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
              <span style="font-family:var(--mono); font-size:13px; color:var(--text-muted);">
                📄 Code (<span style="color:var(--accent);">testLabBarrier.js</span>):
              </span>
              <button type="button" class="btn btn-primary" id="testEvalCodeBtn" style="padding:6px 14px; font-size:13px; background:linear-gradient(135deg, #10b981, #059669);" title="ประมวลผลโค้ดด้วย eval()">
                ⚡ Test Eval Code
              </button>
            </div>
            <textarea id="modalTextarea" class="tab1-textarea" placeholder="กำลังโหลดโค้ดจาก testLabBarrier.js..."></textarea>
          </div>

          <!-- อันสอง: div ว่างๆ -->
          <div id="tab2" class="tab-content">
            <div id="emptyDiv" class="tab2-empty-div"></div>
          </div>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button type="button" id="cancelBtn" class="btn btn-secondary">ยกเลิก</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Toggle & Tab Switch Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggleModalBtn');
      const closeBtn = document.getElementById('closeBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const overlay = document.getElementById('modalOverlay');
      const modalForm = document.getElementById('modalForm');
      const modalTextarea = document.getElementById('modalTextarea');
      const testEvalCodeBtn = document.getElementById('testEvalCodeBtn');
      const tabBtns = document.querySelectorAll('.tab-btn');
      const tabContents = document.querySelectorAll('.tab-content');

      // Load code from testLabBarrier.js via PHP
      function loadLabBarrierCode() {
        fetch('./php/get_lab_barrier.php')
          .then(res => res.json())
          .then(data => {
            if (data && data.success && data.code && modalTextarea) {
              modalTextarea.value = data.code;
            }
          })
          .catch(() => {
            fetch('./php/testLabBarrier.js')
              .then(r => r.text())
              .then(txt => { if (txt && modalTextarea) modalTextarea.value = txt; })
              .catch(() => {});
          });
      }

      // Test Eval Code Event
      if (testEvalCodeBtn) {
        testEvalCodeBtn.addEventListener('click', () => {
          const code = modalTextarea ? modalTextarea.value : '';
          if (!code.trim()) {
            alert('ไม่มีโค้ดใน Textarea');
            return;
          }
          try {
            const evalResult = window.eval(code);
            if (typeof window.testLabBariier === 'function') {
              window.testLabBariier();
            } else if (typeof window.testLabBarrier === 'function') {
              window.testLabBarrier();
            }
          } catch (err) {
            console.error('Eval error:', err);
            alert('Eval Error:\n' + err.message);
          }
        });
      }

      // Toggle Function
      function toggleModal() {
        overlay.classList.toggle('show');
        const isOpen = overlay.classList.contains('show');
        overlay.setAttribute('aria-hidden', !isOpen);
        document.body.style.overflow = isOpen ? 'hidden' : '';
      }

      function closeModal() {
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      // Event Listeners for Toggle & Close
      toggleBtn.addEventListener('click', toggleModal);
      closeBtn.addEventListener('click', closeModal);
      cancelBtn.addEventListener('click', closeModal);

      // Close on Backdrop Click
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          closeModal();
        }
      });

      // Close on ESC Key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('show')) {
          closeModal();
        }
      });

      // Tabs Logic
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const tabId = btn.getAttribute('data-tab');

          tabBtns.forEach(b => b.classList.remove('active'));
          tabContents.forEach(c => c.classList.remove('active'));

          btn.classList.add('active');
          const targetContent = document.getElementById(tabId);
          if (targetContent) {
            targetContent.classList.add('active');
          }
        });
      });

      // Form Submit
      modalForm.addEventListener('submit', (e) => {
        e.preventDefault();
        closeModal();
      });

      // Init load code
      loadLabBarrierCode();
    });
  </script>
</body>
</html>
